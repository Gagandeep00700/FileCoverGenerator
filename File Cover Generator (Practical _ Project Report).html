<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>File Cover Generator (Practical / Project Report)</title>
<style>
  :root{--bg:#f3f4f6;--panel:#fff;--ink:#1d2433;--muted:#5b6475;--line:#d5d9e2;--accent:#8e1b2c}
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI",Calibri,Arial,sans-serif;background:var(--bg);color:var(--ink)}
  .wrap{display:grid;grid-template-columns:minmax(300px,420px) 1fr;gap:24px;max-width:1100px;margin:0 auto;padding:24px}
  @media(max-width:800px){.wrap{grid-template-columns:1fr}}
  form{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:20px}
  h1{font-size:20px;margin:0 0 4px}
  p.sub{margin:0 0 16px;color:var(--muted);font-size:14px}
  fieldset{border:0;border-top:1px solid var(--line);margin:14px 0 0;padding:10px 0 0}
  legend{font-weight:600;font-size:14px;padding-right:8px;color:var(--accent)}
  label{display:block;font-size:13px;color:var(--muted);margin:8px 0 3px}
  select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;font:inherit;color:var(--ink);background:#fff}
  select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  input{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;font:inherit;color:var(--ink);background:#fff}
  input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .preview{display:flex;flex-direction:column;align-items:center;gap:14px}
  canvas{width:100%;max-width:520px;height:auto;background:#fff;border:1px solid var(--line);box-shadow:0 2px 10px rgba(0,0,0,.08)}
  button{background:var(--accent);color:#fff;border:0;border-radius:6px;padding:10px 18px;font:inherit;font-weight:600;cursor:pointer}
  button.alt{background:#fff;color:var(--accent);border:1px solid var(--accent)}
  .btns{display:flex;gap:10px;flex-wrap:wrap}
</style>
</head>
<body>
<div class="wrap">
  <form id="f" onsubmit="return false">
    <h1>File cover page</h1>
    <p class="sub">Pick a type, fill in the details; the preview updates as you type.</p>

    <fieldset><legend>Document type</legend>
      <label for="doctype">Type (fills in sensible defaults)</label>
      <select id="doctype">
        <option value="practical">Practical File</option>
        <option value="project">Project Report</option>
        <option value="assignment">Assignment</option>
        <option value="custom">Custom (type your own heading)</option>
      </select>
      <label for="heading">Heading on the cover</label>
      <input id="heading" value="Practical File">
    </fieldset>

    <fieldset><legend>Subject</legend>
      <label for="topic">Subject name / Project title</label>
      <input id="topic" value="Artificial Intelligence & Soft Computing Techniques">
      <div class="row">
        <div><label for="code">Paper code (blank = hidden)</label><input id="code" value="PR-2129"></div>
        <div><label for="semester">Semester (number)</label><input id="semester" type="number" min="1" max="12" value="2"></div>
      </div>
      <label for="extra">Extra line above course (optional)</label>
      <input id="extra" value="" placeholder="e.g. Submitted in partial fulfilment of the requirements for the degree of">
      <label for="course">Course</label>
      <input id="course" value="Masters in Computer Application">
      <label for="session">Session</label>
      <input id="session" value="2025-2026">
    </fieldset>

    <fieldset><legend>Institute</legend>
      <label for="uni">University / Centre</label>
      <input id="uni" value="Panjab University Regional Centre">
      <label for="place">Place</label>
      <input id="place" value="Sri Muktsar Sahib">
      <label for="logo">Logo (blank = Panjab University seal)</label>
      <input id="logo" type="file" accept="image/*">
    </fieldset>

    <fieldset><legend>Submitted by</legend>
      <label for="by">Name</label><input id="by" value="Gagandeep">
      <label for="roll">Roll no.</label><input id="roll" value="2716">
      <label for="byDept">Department (use | for a new line)</label>
      <input id="byDept" value="Department of Computer Science|& Application|Panjab University Regional Centre|Sri Muktsar Sahib">
    </fieldset>

    <fieldset><legend>Submitted to / Guide</legend>
      <label for="toHead">Label on the cover</label><input id="toHead" value="Submitted To:">
      <label for="to">Name</label><input id="to" value="Ms. Veerpal Kaur">
      <label for="desig">Designation</label><input id="desig" value="Assistant Professor">
      <label for="toDept">Department (use | for a new line)</label>
      <input id="toDept" value="Department of Computer Science|& Applications|Panjab University Regional Centre|Sri Muktsar Sahib">
    </fieldset>
  </form>

  <div class="preview">
    <canvas id="c" width="840" height="1118"></canvas>
    <div class="btns">
      <button id="png">Download PNG</button>
    </div>
  </div>
</div>

const ordinal = n => {
  n = parseInt(n, 10); if (isNaN(n)) return {n: '', s: ''};
  const v = n % 100, s = (v >= 11 && v <= 13) ? 'th' : ({1:'st',2:'nd',3:'rd'}[n % 10] || 'th');
  return {n, s};
};
const font = (px, bold) => `${bold ? 'bold ' : ''}${px * S}px ${FONT}`;

function wrap(text, f, maxW) {
  ctx.font = f;
  const words = text.split(/\s+/), lines = []; let cur = '';
  for (const w of words) {
    const t = cur ? cur + ' ' + w : w;
    if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t;
  }
  if (cur) lines.push(cur);
  return lines;
}

// centered line made of segments: [{t, f, dy}]
function segLine(segs, cx, y) {
  ctx.textAlign = 'left';
  let total = 0;
  segs.forEach(s => { ctx.font = s.f; s.w = ctx.measureText(s.t).width; total += s.w; });
  let x = cx - total / 2;
  segs.forEach(s => { ctx.font = s.f; ctx.fillText(s.t, x, y + (s.dy || 0)); x += s.w; });
}

function centered(text, f, cx, y) {
  ctx.font = f; ctx.textAlign = 'center'; ctx.fillText(text, cx, y);
}

function arcText(text, cx, cy, r, bottom) {
  ctx.save(); ctx.translate(cx, cy);
  const step = (bottom ? 0.2 : 0.17), total = step * (text.length - 1);
  for (let i = 0; i < text.length; i++) {
    const a = bottom ? (Math.PI / 2 + total / 2 - i * step) : (-Math.PI / 2 - total / 2 + i * step);
    ctx.save(); ctx.rotate(a); ctx.translate(0, bottom ? r : -r);
    if (bottom) ctx.rotate(Math.PI);
    ctx.textAlign = 'center'; ctx.fillText(text[i], 0, 0); ctx.restore();
  }
  ctx.restore();
}

function defaultSeal(cx, cy, r) {
  const red = '#b3202e';
  ctx.save();
  ctx.fillStyle = red; ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(cx, cy, r * 0.97, 0, 7); ctx.fill();
  ctx.fillStyle = red; ctx.beginPath(); ctx.arc(cx, cy, r * 0.93, 0, 7); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(cx, cy, r * 0.66, 0, 7); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = `bold ${r * 0.17}px ${FONT}`;
  arcText('PANJAB UNIVERSITY', cx, cy, r * 0.78, false);
  ctx.font = `bold ${r * 0.18}px ${FONT}`; arcText('1947', cx, cy, r * 0.78, true);
  // sun rays + book
  ctx.strokeStyle = red; ctx.lineWidth = r * 0.025;
  for (let i = 0; i < 13; i++) {
    const a = Math.PI + (i / 12) * Math.PI;
    ctx.beginPath(); ctx.moveTo(cx + Math.cos(a) * r * 0.2, cy - r * 0.05 + Math.sin(a) * r * 0.2);
    ctx.lineTo(cx + Math.cos(a) * r * 0.5, cy - r * 0.05 + Math.sin(a) * r * 0.5); ctx.stroke();
  }
  ctx.fillStyle = red; ctx.beginPath(); ctx.arc(cx, cy - r * 0.05, r * 0.18, Math.PI, 0); ctx.fill();
  ctx.fillRect(cx - r * 0.5, cy + r * 0.12, r, r * 0.07);
  ctx.fillRect(cx - r * 0.45, cy + r * 0.24, r * 0.9, r * 0.05);
  ctx.restore();
}

function draw() {
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.fillStyle = '#000'; ctx.textBaseline = 'alphabetic';
  const cx = 210 * S; let y = 72 * S;

  wrap($('heading') || ' ', font(22, true), 360 * S).forEach((l, i) => { if (i) y += 28 * S; centered(l, font(22, true), cx, y); });

  y += 26 * S;
  wrap($('topic'), font(15, true), 330 * S).forEach(l => { centered(l, font(15, true), cx, y); y += 21 * S; });
  if ($('code')) { centered($('code'), font(15, true), cx, y); y += 22 * S; }
  if ($('extra')) {
    wrap($('extra'), font(10.5, false), 320 * S).forEach(l => { centered(l, font(10.5, false), cx, y); y += 16 * S; });
    y += 4 * S;
  }
  centered($('course'), font(14, true), cx, y);

  y += 25 * S;
  const o = ordinal($('semester'));
  segLine([
    {t: String(o.n), f: font(12, true)},
    {t: o.s, f: font(7.5, true), dy: -4.5 * S},
    {t: ' Semester', f: font(12, true)}
  ], cx, y);

  y += 25 * S; centered('Session (' + $('session') + ')', font(12, true), cx, y);
  y += 22 * S; centered($('uni'), font(13, true), cx, y);
  y += 20 * S; centered($('place'), font(12, true), cx, y);

  // logo
  const ly = y + 62 * S, lr = 52 * S;
  const L = logoImg || defaultLogo;
  if (L) {
    const k = Math.min(lr * 2 / L.width, lr * 2 / L.height);
    ctx.drawImage(L, cx - L.width * k / 2, ly - L.height * k / 2, L.width * k, L.height * k);
  } else defaultSeal(cx, ly, lr);

  // submitted by / to
  const by0 = Math.max(ly + lr + 40 * S, 398 * S);
  block(118 * S, by0, 'Submitted By:', [[$('by'), 1], [$('roll'), 1]], $('byDept'));
  block(290 * S, by0, $('toHead') || 'Submitted To:', [[$('to'), 1], [$('desig'), 1]], $('toDept'));
}

function block(x, y, head, boldLines, dept) {
  ctx.fillStyle = '#000';
  centered(head, font(10, false), x, y); y += 14 * S;
  boldLines.forEach(([t]) => { if (t) { centered(t, font(10, true), x, y); y += 14 * S; } });
  dept.split('|').forEach(l => { centered(l.trim(), font(9.5, false), x, y); y += 14 * S; });
}

const PRESETS = {
  practical: {heading:'Practical File', topic:'Artificial Intelligence & Soft Computing Techniques', code:'PR-2129', extra:'', toHead:'Submitted To:', to:'Ms. Veerpal Kaur', desig:'Assistant Professor'},
  project: {heading:'Project Report', topic:'Youtube Downloader By Gagan', code:'', extra:'Submitted in partial fulfilment of the requirements for the degree of', toHead:'Under the Guidance of:', to:'Ranveer Sir', desig:''},
  assignment: {heading:'Assignment', topic:'', code:'', extra:'', toHead:'Submitted To:', to:'', desig:''}
};
document.getElementById('doctype').addEventListener('change', e => {
  const p = PRESETS[e.target.value];
  if (p) Object.keys(p).forEach(k => { document.getElementById(k).value = p[k]; });
  draw();
});
document.querySelectorAll('#f input:not([type=file])').forEach(i => i.addEventListener('input', draw));
document.getElementById('logo').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) { logoImg = null; draw(); return; }
  const rd = new FileReader();
  rd.onload = () => {
    const img = new Image();
    img.onload = () => { logoImg = img; draw(); };
    img.onerror = () => alert('Could not read this image. Try a PNG or JPG file.');
    img.src = rd.result;
  };
  rd.onerror = () => alert('Could not open the file.');
  rd.readAsDataURL(f);
});
const pngBtn = document.getElementById('png');
pngBtn.addEventListener('click', async () => {
  try {
    const dl = await claude.use('downloads');
    if (!dl) { alert('Saving is not available in this view. Open the artifact in claude.ai.'); return; }
    const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
    await dl.save({filename: (($('heading') || 'file').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'file') + '-cover.png', data: blob});
  } catch (e) { if (!e || e.code !== 'declined') alert('Could not save the image.'); }
});

(document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(draw);
draw();
</script>
